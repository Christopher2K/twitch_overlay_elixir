<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stream Captions — Setup</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f5;
        color: #18181b;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .card {
        width: min(440px, calc(100vw - 48px));
        background: #fff;
        border-radius: 16px;
        padding: 32px;
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.06),
          0 12px 32px rgb(0 0 0 / 0.08);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      p.sub {
        margin: 0 0 24px;
        color: #52525b;
        font-size: 14px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d4d4d8;
        border-radius: 10px;
        font: inherit;
      }
      input:focus {
        outline: 2px solid #4f46e5;
        outline-offset: -1px;
        border-color: #4f46e5;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 10px;
        background: #4f46e5;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .error {
        margin-top: 12px;
        color: #b91c1c;
        font-size: 13px;
        min-height: 18px;
      }
      .hint {
        margin-top: 20px;
        color: #71717a;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <form class="card" id="form">
      <h1>Stream Captions</h1>
      <p class="sub">
        Connect to your Twitch overlay server. The app opens its live captions
        page; log in once and the session is remembered.
      </p>
      <label for="server">Server address</label>
      <input
        id="server"
        type="url"
        placeholder="http://localhost:4000"
        autocomplete="url"
        spellcheck="false"
        required
      />
      <button id="save" type="submit">Connect</button>
      <div class="error" id="error" role="alert"></div>
      <p class="hint">
        Use the same address you open the admin dashboard with. You can change
        it later from the Captions menu.
      </p>
    </form>
    <script>
      const form = document.getElementById("form");
      const input = document.getElementById("server");
      const button = document.getElementById("save");
      const error = document.getElementById("error");

      window.captionsDesktop.getServer().then((url) => {
        if (url) input.value = url;
        input.focus();
        input.select();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        button.disabled = true;
        button.textContent = "Connecting…";
        try {
          const result = await window.captionsDesktop.saveServer(input.value);
          if (!result.ok) {
            error.textContent = result.error;
          } else if (result.restarting) {
            button.textContent = "Restarting…";
            return;
          }
        } catch (reason) {
          error.textContent = String(reason?.message ?? reason);
        }
        button.disabled = false;
        button.textContent = "Connect";
      });
    </script>
  </body>
</html>
